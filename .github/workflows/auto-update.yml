name: 🤖 ETF 自動與手動更新排程

on:
  # 1. 🕒 雲端定時排程：每週一到週五，台灣時間晚上 8:00 (UTC 12:00) 自動跑
  schedule:
    - cron: '0 12 * * 1-5'

  # 2. 📱 手動觸發開關：隨時可以在 GitHub 網頁 / 手機 App 點按鈕執行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 下載您的程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 安裝 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. 安裝必備套件 (包含爬蟲與HTML解析所需)
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests selenium webdriver-manager lxml

      - name: 4. 🤖 執行自動爬蟲抓取最新檔案 (內建開市雙保險防護)
        run: python etf_downloader.py

      - name: 5. 🧮 執行自動清洗與產出報表
        run: |
          rm -rf data/.cache
          python script/generate.py

      - name: 6. 💾 將新檔案與報表存檔並推回 GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 自動排程：同步最新 ETF 資料與優化版報表" && git push)